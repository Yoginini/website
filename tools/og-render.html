<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yoginini OG card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Figtree:wght@300;400;500&family=Space+Mono&display=swap">
<style>
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #100d17; color: #ece7f3;
    font-family: Figtree, system-ui, sans-serif;
    position: relative; display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 72px; box-sizing: border-box;
  }
  .glow {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(46% 62% at 88% 16%, rgba(179,157,219,.30), transparent 68%),
      radial-gradient(38% 48% at 4% 104%, rgba(224,168,107,.12), transparent 70%);
  }
  .top { position: relative; display: flex; align-items: center; gap: 14px; }
  .top .name { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 500; letter-spacing: .02em; }
  .top .name em { font-style: italic; font-weight: 300; color: #d6cbef; }
  .k {
    position: relative; font-family: 'Space Mono', monospace; font-size: 15px;
    letter-spacing: .18em; text-transform: uppercase; color: #b39ddb; margin: 0 0 22px;
  }
  h1 {
    position: relative; font-family: 'Cormorant Garamond', serif; font-weight: 400;
    font-size: 76px; line-height: .98; letter-spacing: -.015em; margin: 0; max-width: 17ch;
  }
  h1 em { font-style: italic; font-weight: 300; color: #d6cbef; }
  .sub {
    position: relative; font-size: 21px; line-height: 1.45; color: #b8b2c2;
    font-weight: 300; margin: 26px 0 0; max-width: 62ch;
  }
  .foot {
    position: relative; display: flex; justify-content: space-between; align-items: flex-end;
    font-family: 'Space Mono', monospace; font-size: 14px; letter-spacing: .1em; color: #7f788b;
  }
  .lotus { width: 46px; height: 46px; flex: none; }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="top">
    <svg class="lotus" viewBox="0 0 120 120" aria-hidden="true">
      <g>
        <path fill="#5E4B9A" transform="rotate(-44 60 92)" d="M60 92C51 81 48 65 53 51 61 62 63 79 60 92Z"/>
        <path fill="#5E4B9A" transform="rotate(44 60 92)"  d="M60 92C69 81 72 65 67 51 59 62 57 79 60 92Z"/>
        <path fill="#B39DDB" transform="rotate(-22 60 92)" d="M60 92C52 79 50 60 55 44 63 57 64 78 60 92Z"/>
        <path fill="#B39DDB" transform="rotate(22 60 92)"  d="M60 92C68 79 70 60 65 44 57 57 56 78 60 92Z"/>
        <path fill="#D6CBEF" d="M60 92C53 78 53 55 60 38 67 55 67 78 60 92Z"/>
        <path fill="none" stroke="#D6CBEF" stroke-opacity=".6" stroke-width="2.6" stroke-linecap="round" d="M40 94A20 9 0 0 0 80 94"/>
      </g>
    </svg>
    <span class="name">yogin<em>ini</em></span>
  </div>

  <div>
    <p class="k" id="k">Early access</p>
    <h1 id="t">A yoga teacher <em>who can see you.</em></h1>
    <p class="sub" id="s">Prop up your phone. Yoginini watches your form through the camera and speaks gentle corrections out loud.</p>
  </div>

  <div class="foot">
    <span>YOGININI.US</span>
    <span id="badge">IN DEVELOPMENT</span>
  </div>

<script>
  // ?t=title&k=kicker&s=subtitle&b=badge — the title may contain <em>.
  const q = new URLSearchParams(location.search);
  const set = (id, key, html) => {
    const v = q.get(key);
    if (v === null) return;
    const el = document.getElementById(id);
    if (html) el.innerHTML = v; else el.textContent = v;
  };
  set('t', 't', true);
  set('k', 'k', false);
  set('s', 's', false);
  set('badge', 'b', false);
  // Shrink very long titles so they never overflow the card.
  const h = document.getElementById('t');
  let size = 76;
  while (h.scrollHeight > 300 && size > 46) { size -= 3; h.style.fontSize = size + 'px'; }
</script>
</body>
</html>
