<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Yoginini">
  <title>Yoginini</title>
  <desc>A crown lotus that opens and closes on a slow breath.</desc>
  <style>
    .p { transform-origin: 60px 92px; transform-box: view-box; }
    .o1 { animation: o1 6s ease-in-out infinite; }
    .o2 { animation: o2 6s ease-in-out infinite; }
    .m1 { animation: m1 6s ease-in-out infinite; }
    .m2 { animation: m2 6s ease-in-out infinite; }
    .c  { animation: cc 6s ease-in-out infinite; }
    .halo { transform-origin: 60px 68px; transform-box: view-box; animation: halo 6s ease-in-out infinite; }
    @keyframes o1 { 0%,100% { transform: rotate(-16deg) scaleY(.7); opacity: .5 } 50% { transform: rotate(-70deg) scaleY(.9); opacity: .9 } }
    @keyframes o2 { 0%,100% { transform: rotate(16deg)  scaleY(.7); opacity: .5 } 50% { transform: rotate(70deg)  scaleY(.9); opacity: .9 } }
    @keyframes m1 { 0%,100% { transform: rotate(-8deg)  scaleY(.85) } 50% { transform: rotate(-38deg) scaleY(1) } }
    @keyframes m2 { 0%,100% { transform: rotate(8deg)   scaleY(.85) } 50% { transform: rotate(38deg)  scaleY(1) } }
    @keyframes cc { 0%,100% { transform: scaleY(.9) } 50% { transform: scaleY(1.06) } }
    @keyframes halo { 0%,100% { opacity: .18; transform: scale(.82) } 50% { opacity: .42; transform: scale(1) } }
    @media (prefers-reduced-motion: reduce) { .p, .halo { animation: none } }
  </style>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#B39DDB" stop-opacity=".38"/>
      <stop offset="55%"  stop-color="#B39DDB" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#B39DDB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle class="halo" cx="60" cy="68" r="52" fill="url(#halo)"/>
  <g>
    <path class="p o1" fill="#5E4B9A" d="M60 92C51 81 48 65 53 51 61 62 63 79 60 92Z"/>
    <path class="p o2" fill="#5E4B9A" d="M60 92C69 81 72 65 67 51 59 62 57 79 60 92Z"/>
    <path class="p m1" fill="#B39DDB" d="M60 92C52 79 50 60 55 44 63 57 64 78 60 92Z"/>
    <path class="p m2" fill="#B39DDB" d="M60 92C68 79 70 60 65 44 57 57 56 78 60 92Z"/>
    <path class="p c"  fill="#D6CBEF" d="M60 92C53 78 53 55 60 38 67 55 67 78 60 92Z"/>
  </g>
  <path fill="none" stroke="#D6CBEF" stroke-opacity=".6" stroke-width="2.4" stroke-linecap="round" d="M40 94A20 9 0 0 0 80 94"/>
</svg>
